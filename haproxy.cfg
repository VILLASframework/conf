global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http_front
    bind *:80
    mode http
    default_backend http_back

backend http_back
    server new_server 172.29.176.1:80 check
    mode http
    stick-table type ip size 200k expire 30m
    stick on src
    server server1 10.0.0.1:8080 check
    server server2 10.0.0.2:8080 check
    server server3 10.0.0.3:8080 check
    server server4 10.0.0.4:8080 check
    server server5 10.0.0.5:8080 check

backend backend2
    balance leastconn
    mode http
    server my_server3 192.168.1.100:8080 check
    server server6 10.0.0.6:8080 check
    server server7 10.0.0.7:8080 check
    server server8 10.0.0.8:8080 check
    server server9 10.0.0.9:8080 check
    server server10 10.0.0.10:8080 check

backend backend3
    balance source
    mode http
    server server7 192.168.1.108:8080 check
    server server11 10.0.0.11:8080 check
    server server12 10.0.0.12:8080 check
    server server13 10.0.0.13:8080 check
    server server14 10.0.0.14:8080 check
    server server15 10.0.0.15:8080 check

backend my_backend
    balance roundrobin
    server server8 192.168.1.109:8080 check
    server server16 10.0.0.16:8080 check
    server server17 10.0.0.17:8080 check
    server server18 10.0.0.18:8080 check
    server server19 10.0.0.19:8080 check
    server server20 10.0.0.20:8080 check



