version: "3.7"

services:
  node-red:
    image: nodered/node-red:latest
    entrypoint: /entrypoint.sh
    hostname: "nodered"
    environment:
      - TZ=Europe/Berlin
    ports:
      - 1880:1880
    volumes:
      - ../../containerData:/data
      - ../../villas-conf-node:/villas-conf-node
      - ./entrypoint.sh:/entrypoint.sh