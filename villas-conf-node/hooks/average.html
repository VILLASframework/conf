<script type="text/html" data-template-name="average">

<script type="text/html" data-help-name="average">
    <p>This hook calculates the average (arithmetic mean) of multiple signals and outputs the result as a new value.</p>
    <p>
        <b>Offset:</b> The signal offset at which the average signal should be inserted.<br>
        Examples:<br>
        <b>0</b> inserts the averaged signal before all other signals in the sample<br>
        <b>1</b> inserts the averaged signal after the first signal.</p>
        <b>Priority:</b> The hook priority determines execution order.
        Hooks with a lower priority are executed before ones with a higher priority.<br>

        If no priority is configured, hooks are executed in the order in which they are listed
        in the configuration file.<br>
    </p>
</script>
