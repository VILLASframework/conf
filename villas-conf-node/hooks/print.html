<script type="text/javascript">
    RED.nodes.registerType('print', {
        category: 'Hooks',
        color: '#a6bbcf',
        defaults: {
            name: { value: "" },
            output: { value: "/dev/stdout" },
            format: { value: "villas.human" },
            prefix: { value: "" },
            enabled: { value: true },
            priority: { value: 99 }
        },
        inputs: 1,
        outputs: 1,
        icon: "file.svg",
        label: function () {
            return this.name || "print";
        }
    });
</script>

<script type="text/html" data-template-name="print">
    <div class="form-row">
        <label>Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label>Output Path</label>
        <input type="text" id="node-input-output" placeholder="/dev/stdout or filename.log">
    </div>
    <div class="form-row">
        <label>Format</label>
        <input type="text" id="node-input-format" placeholder="e.g. villas.human">
    </div>
    <div class="form-row">
        <label>Prefix</label>
        <input type="text" id="node-input-prefix" placeholder="Optional log prefix">
    </div>
    <div class="form-row">
        <label>Enabled</label>
        <input type="checkbox" id="node-input-enabled">
    </div>
    <div class="form-row">
        <label>Priority</label>
        <input type="number" id="node-input-priority">
    </div>
</script>

<script type="text/html" data-help-name="print">
    <p>
        The <code>print</code> hook prints sample data to standard output or a file.
        You can define the output path, format, and an optional prefix.
        <strong>Note:</strong> "output" and "prefix" are mutually exclusive.
    </p>
</script>
