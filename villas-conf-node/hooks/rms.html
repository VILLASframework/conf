<script type="text/javascript">
    RED.nodes.registerType('rms',{
        category: 'Hooks',
        color: '#25C2A0',
        defaults: {
            hooktype: { value: "rms", required: true },
            windowsize: { value: 0, required: true},
            enabled: { value: true },
            priority: { value: "" },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-calculator",
        label: function() {
            return this.name||"rms";
        }
    });
</script>

<script type="text/html" data-template-name="rms">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-windowsize"><i class="fa fa-plus"></i> Window Size</label>
        <input type="number" id="node-input-windowsize" step="any">
    </div>
</script>

<script type="text/html" data-help-name="rms">
    <p>The rms hook calculates the Root Mean Square (RMS) of signals on a given window.</p>
</script>
