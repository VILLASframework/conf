<script type="text/javascript">
    RED.nodes.registerType('rms',{
        category: 'Hooks',
        color: '#25C2A0',
        defaults: {
            hooktype: { value: "rms", required: true },
            windowsize: { value: 0, required: true},
            //enabled: { value: true },
            priority: { value: "", required: false},
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-calculator",
        label: function() {
            return this.name||"rms";
        }
    });
</script>

<script type="text/html" data-template-name="rms">
    <div class="form-row">
      <label for="node-input-villas-type"><i class="fa fa-tag"></i> Type</label>
      <input type="text" id="node-input-villas-type" placeholder="Type" value="rms" readonly/>
  </div>
    <div class="form-row">
        <label for="node-input-windowsize"><i class="fa fa-minus-square-o"></i> Window Size</label>
        <input type="number" id="node-input-windowsize" step="any">
    </div>
    <div class="form-row">
      <label for="node-input-villas-priority"><i class="fa fa-sort"></i> Priority</label>
      <input type="number" name="node-input-priority" id="node-input-priority" placeholder="99" value="99"/>
  </div>
</script>

<script type="text/html" data-help-name="rms">
    <p>The rms hook calculates the Root Mean Square (RMS) of signals on a given window.</p>
    <p>
        <b>Window Size:</b> The size of the window (number of samples) which should be used for the moving average filter.<br>
        <b>Priority:</b> The hook priority determines execution order.
        Hooks with a lower priority are executed before ones with a higher priority.<br>

        If no priority is configured, hooks are executed in the order in which they are listed
        in the configuration file.<br>
    </p>
</script>
