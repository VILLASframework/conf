<script type="text/javascript">
  var villasconfRootConfig = {
    nodes: {},
    paths: [],
  };

  RED.nodes.registerType("config-start", {
    category: "function",
    color: "#ff0000",
    defaults: {},
    inputs: 0,
    outputs: 1,
    icon: "file.svg",
    label: function () {
      return this.name || "config-start";
    },
    button: {
      onclick: function () {
        var node = this;
        var label = "config-start";
        $.ajax({
          url: "startconfig/" + node.id,
          type: "POST",
          data: JSON.stringify({ payload: villasconfRootConfig } || {}),
          contentType: "application/json; charset=utf-8",
          success: function (resp) {
            RED.notify(node._("inject.success", { label: label }), {
              type: "success",
              id: "inject",
              timeout: 2000,
            });
          },
          error: function (jqXHR, textStatus, errorThrown) {
            if (jqXHR.status == 404) {
              RED.notify(
                node._("common.notification.error", {
                  message: node._("common.notification.errors.not-deployed"),
                }),
                "error",
              );
            } else if (jqXHR.status == 500) {
              RED.notify(
                node._("common.notification.error", {
                  message: node._("inject.errors.failed"),
                }),
                "error",
              );
            } else if (jqXHR.status == 0) {
              RED.notify(
                node._("common.notification.error", {
                  message: node._("common.notification.errors.no-response"),
                }),
                "error",
              );
            } else {
              RED.notify(
                node._("common.notification.error", {
                  message: node._("common.notification.errors.unexpected", {
                    status: jqXHR.status,
                    message: textStatus,
                  }),
                }),
                "error",
              );
            }
          },
        });
      },
    },
  });
</script>
