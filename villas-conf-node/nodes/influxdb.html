<script type="text/javascript">
    RED.nodes.registerType('influxdb', {
        category: 'Nodes',
        color: '#8EBAE5',
        defaults: {
            name: { value: "" },
            server: { value: "localhost:8089", required: true },
            key: { value: "villas", required: true }
        },
        inputs: 1,
        outputs: 0,
        icon: "font-awesome/fa-database",
        label: function () {
            return this.name || "InfluxDB Node";
        }
    });
</script>

<script type="text/html" data-template-name="influxdb">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-server"></i> InfluxDB Server</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-key"><i class="fa fa-key"></i> Key</label>
        <input type="text" id="node-input-key">
    </div>
</script>

<script type="text/html" data-help-name="influxdb">
    <p>Dieser Node sendet Daten an eine InfluxDB-Datenbank, indem er das Line-Protokoll über UDP verwendet.</p>
</script>
