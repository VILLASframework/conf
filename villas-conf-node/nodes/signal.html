<script type="text/javascript">
  RED.nodes.registerType("signal", {
    category: "function",
    color: "#ff0000",
    defaults: {
      nodetype: { value: "signal.v2", required: true },
      name: { value: "" },
      signalIdEncoded: { value: "" },
      signalIdTemplate: { value: "", type: "signal-config" },
      testEncoded: { value: "[]" },
      "villas-realtime": { value: true },
      "villas-limit": { value: 0 },
      "villas-rate": { value: 0 },
      "villas-monitor_missed": { value: false },
      "villas-vectorize": { value: 1 },
    },
    inputs: 1,
    outputs: 1,
    icon: "file.svg",
    label: function () {
      return this.name || "signal";
    },
    oneditsave: function () {
      const node = this;
      const saveArray = (name) => {
        const items = $(`.array-${name} .form-subrow`).children();
        if (!items || items === undefined || items.length === 0) {
          node[name] = [];
          return;
        }

        let inputType = "";

        const values = [];
        for (const item of items) {
          const input = $(item).find(":input").first();

          if (inputType === "") {
            inputType = input.prop("nodeName");
          }

          const value = input.val();
          if (value !== undefined && value !== "") {
            values.push(value);
          }
        }
        node[name] = values;
        $(`.array-${name} .array-encoded`)
          .first()
          .val(JSON.stringify({ values: values, type: inputType }));
      };
      saveArray("test");
      saveArray("signalId");
      console.log("Saved Array: ", node["signalId"]);
      console.log("Saved encoded: ", $(`#node-input-${name}Enc`));
    },
    oneditprepare: function () {
      const node = this;
      const dialogForm = $("#dialog-form");
      console.log("called");

      /**
       * @param {string} name - the name of the array property
       */
      const arrayConfigurator = (name) => {
        const isSelect = $(`.array-template-${name}`).hasClass("select");
        const addItem = (val = isSelect ? "_ADD_" : "") => {
          const subrow = $(`.array-${name} .form-subrow`);
          const template = $(`.array-template-${name}`).clone();

          // now we have to edit the input for some thing to happen
          const templateInput = template.find(":input").first();
          const templateLabel = template.find("label").first();
          const rowId = crypto.randomUUID();

          // we should probably not use labels
          templateInput.id = `array-input-${rowId}`;
          templateLabel.for = `array-input-${rowId}`;
          templateInput.val(val);

          templateInput.on("change", () => {
            if (templateInput.val() !== isSelect ? "_ADD_" : "")
              addItem(isSelect ? "_ADD_" : "");
            console.log("changed input value: ", templateInput.val());
          });

          if (template.hasClass("select")) {
            template.find("a").remove();
          }

          // remove template identifier and thus not hidden and add to subrow
          template.removeClass(`array-template-${name}`);
          template.removeClass(`array-template`);
          template.addClass(`array-row-${name} array-row`);
          template.appendTo(subrow);
        };

        const subrow = $(`.array-${name} .form-subrow`);
        console.log("node: ", node[name]);
        if (node[name] === [] || node[name] === undefined) {
          // the property is empty remove all current
          addItem();
        } else if (Array.isArray(node[name])) {
          for (const item of node[name].filter((x) => x !== "_ADD_")) {
            addItem(item);
          }
          addItem();
        }
      };

      arrayConfigurator("test");
      arrayConfigurator("signalId");
    },
  });
</script>
